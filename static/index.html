<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tilli's Maths Adventure</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Baloo+2:wght@500;600;700;800&display=swap">
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<div class="sky" aria-hidden="true"><i class="cloud c1"></i><i class="cloud c2"></i><i class="cloud c3"></i><i class="sun"></i></div>
<header class="top">
  <div class="brand">Tilli's Maths Adventure<small>Adding and taking away</small></div>
  <div class="toggles">
    <span class="stars" id="stars" hidden title="Stars you earned">⭐ <b id="starN">0</b></span>
    <button class="ghost" id="tgVoice" aria-pressed="true">🔊 Tilli talks</button>
    <button class="ghost" id="tgRestart">🏠 Start over</button>
  </div>
</header>

<div class="wrap nocopilot" id="wrap">
  <main class="page" aria-live="polite">
    <div class="sheet"><div id="stage"></div></div>
    <div class="controls" id="controls" hidden>
      <button class="soft b-read" id="btnRead">🔊 Read it to me</button>
      <button class="soft b-help" id="btnHelp">💡 Show me how</button>
      <button class="soft b-stuck" id="btnStuck">🤔 I'm stuck</button>
      <button class="soft b-break" id="btnBreak">😴 Take a break</button>
    </div>
  </main>
</div>
<div class="hills" aria-hidden="true"></div>
<div id="fx" aria-hidden="true"></div>
<script src="/static/app.js"></script>
</body>
</html>
